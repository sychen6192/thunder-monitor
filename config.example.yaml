# Copy this file to config.yaml and fill in real credentials.
# config.yaml is gitignored — never commit real tokens.

PROD:
  DEBUG: False
  TELEGRAM_TOKEN: "<your_telegram_bot_token>"
  TELEGRAM_CHAT_ID: "<your_telegram_chat_id>"   # 警報推播對象；此聊天室內一律可下指令
  # COMMAND_USER_IDS: [123456789]   # 選填：這些 Telegram user id 在任何聊天室（含私訊）都可下指令
  CWB_TOKEN: "<your_cwa_opendata_token>"
  LOG: ./log/thunder.log
  POLL_INTERVAL_SECONDS: 60    # 常駐模式的監測間隔（秒），可省略，預設 60
  # HEALTHCHECK_URL: https://hc-ping.com/<uuid>   # 選填：每輪成功後 ping base url，連續失敗達門檻才 ping /fail（dead-man's switch）；留空或省略即停用
  # HEALTHCHECK_FAIL_THRESHOLD: 3   # 選填：連續失敗幾輪才 ping /fail，避免單次 CWA 抖動就告警，預設 3
  AREAS:                       # box = [top, down, left, right]（北界緯度, 南界緯度, 西界經度, 東界經度）
    - name: 高雄
      box: [22.65694, 22.598, 120.158, 120.3025]
    # 舊的無名格式仍相容：- [22.65694, 22.598, 120.158, 120.3025]

STAGE:
  DEBUG: True
  TELEGRAM_TOKEN: "<your_telegram_bot_token>"
  TELEGRAM_CHAT_ID: "<your_telegram_chat_id>"
  CWB_TOKEN: "<your_cwa_opendata_token>"
  LOG: ./log/thunder_stage.log
  AREAS:
    - name: 測試區
      box: [23.76, 23.73, 120.58, 120.65]
