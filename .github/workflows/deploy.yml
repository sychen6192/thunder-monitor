name: Deploy

# Deploys to the self-hosted runner box. The repo is public, so this workflow
# must only ever trigger on push-to-main and manual dispatch — never on
# pull_request, which would let fork PRs reach the runner.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest

  deploy:
    needs: test
    runs-on: self-hosted
    steps:
      - name: Fast-forward app checkout, sync venv, restart service
        run: "$HOME/thunder-monitor/deploy/deploy.sh"
        env:
          DEPLOY_SHA: ${{ github.sha }}
